aid: helmai
name: Helm.ai
description: 'Helm.ai is an AI software company for autonomous driving and robotics,
  founded in 2016 and headquartered in Redwood City, California. It develops camera-first
  perception, path prediction and end-to-end autonomy stacks — Helm.ai Vision and Helm.ai
  Driver — alongside the generative AI development and validation tools VidGen-3, GenSim-3
  and WorldGen-1, all trained with its proprietary Deep Teaching unsupervised learning
  method. The software is licensed to automotive OEMs and Tier 1 suppliers (Honda,
  Volkswagen, Ambarella, NVIDIA, Qualcomm, Texas Instruments) as embedded, hardware-agnostic
  components for production vehicle programs rather than as a public developer API. As of
  2026-08-22 the company publishes no developer portal, API reference, SDK, or
  machine-readable specification on any host it controls.'
